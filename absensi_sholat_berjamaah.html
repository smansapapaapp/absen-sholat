<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Sholat Berjamaah</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        
        /* Custom loader animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #22c55e; /* Green primary color */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glassmorphism effect for the form container */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-card rounded-2xl p-8 relative overflow-hidden">
        
        <!-- Decorative background elements -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-green-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-emerald-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full mb-4">
                <i class="fa-solid fa-mosque text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Absensi Sholat</h1>
            <p class="text-gray-500 text-sm mt-1">Silakan isi kehadiran sholat berjamaah</p>
        </div>

        <form id="absenForm" class="space-y-5 relative z-10">
            
            <!-- Nama Input -->
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="nama" name="nama" required
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 bg-white shadow-sm placeholder-gray-400 focus:outline-none transition-colors"
                        placeholder="Masukkan nama Anda">
                </div>
            </div>

            <!-- Kelas Input -->
            <div>
                <label for="kelas" class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-chalkboard-user text-gray-400"></i>
                    </div>
                    <select id="kelas" name="kelas" required
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 bg-white shadow-sm focus:outline-none transition-colors appearance-none">
                        <option value="" disabled selected>Pilih Kelas</option>
                        <option value="X-1">X-1</option>
                        <option value="X-2">X-2</option>
                        <option value="X-3">X-3</option>
                        <option value="X-4">X-4</option>
                        <option value="X-5">X-5</option>
                        <option value="X-6">X-6</option>
                        <option value="X-7">X-7</option>
                        <option value="X-8">X-8</option>
                        <option value="X-9">X-9</option>
                        <option value="X-10">X-10</option>
                        <option value="XI-1">XI-1</option>
                        <option value="XI-2">XI-2</option>
                        <option value="XI-3">XI-3</option>
                        <option value="XI-4">XI-4</option>
                        <option value="XI-5">XI-5</option>
                        <option value="XI-6">XI-6</option>
                        <option value="XI-7">XI-7</option>
                        <option value="XI-8">XI-8</option>
                        <option value="XI-9">XI-9</option>
                        <option value="XII-1">XII-1</option>
                        <!-- Add more classes as needed -->
                    </select>
                    <!-- Custom dropdown arrow -->
                    <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                        <i class="fa-solid fa-chevron-down text-gray-400 text-sm"></i>
                    </div>
                </div>
            </div>

            <!-- Jenis Sholat Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Sholat Berjamaah</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="relative flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-green-50 transition-colors">
                        <input type="radio" name="sholat" value="Dzuhur" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300" required>
                        <span class="ml-3 text-sm font-medium text-gray-700">Dzuhur</span>
                    </label>
                    <label class="relative flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-green-50 transition-colors">
                        <input type="radio" name="sholat" value="Ashar" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
                        <span class="ml-3 text-sm font-medium text-gray-700">Ashar</span>
                    </label>
                    <label class="relative flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-green-50 transition-colors col-span-2">
                        <input type="radio" name="sholat" value="Jumat" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300">
                        <span class="ml-3 text-sm font-medium text-gray-700">Jumat</span>
                    </label>
                </div>
            </div>

            <!-- Submit Button & Loader -->
            <div class="pt-2">
                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                    <span id="btnText">Kirim Absen</span>
                    <div id="loader" class="loader ml-2"></div>
                </button>
            </div>

            <!-- Status Message Container -->
            <div id="statusMessage" class="hidden rounded-lg p-4 text-sm text-center"></div>

        </form>

        <!-- Footer -->
        <div class="mt-6 text-center text-xs text-gray-400 relative z-10">
            &copy; 2026 Sistem Absensi Siswa
        </div>
    </div>

    <script>
        // =========================================================================
        // URL Web App dari Apps Script Anda yang sudah benar
        // =========================================================================
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbarfVKdsntNyba0lK2JhScfc3490gSSONDYglP2Arxfj_k1GkEb3onU5hk9kcA8ZSqQ/exec'; 

        document.getElementById('absenForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah form reload page

            // Ambil elemen UI
            const form = this;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            // Set state loading
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = 'Mengirim...';
            loader.style.display = 'block';
            hideStatus();

            // Kumpulkan data form
            const formData = new FormData(form);

            // Kirim data menggunakan fetch API
            // Menggunakan method POST seperti yang ditentukan di Apps Script (doPost)
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json(); // Apps Script kita mengembalikan JSON
            })
            .then(data => {
                // Berhasil
                if(data.status === "success") {
                    showStatus('Alhamdulillah, absen berhasil dicatat!', 'success');
                    form.reset(); // Kosongkan form
                } else {
                    showStatus('Gagal mencatat absen: ' + data.message, 'error');
                }
            })
            .catch(error => {
                // Gagal karena jaringan atau error lainnya
                // Catatan: CORS mungkin menyebabkan error di console saat fetch dari local ke script google, 
                // tapi data tetap masuk jika Apps Script dikonfigurasi dengan benar ("Anyone").
                // Kita asumsikan sukses jika script tidak mengembalikan HTTP error
                
                console.error('Error details:', error);
                // Terkadang response dari Apps Script saat submit form html tidak bisa di-parse sebagai JSON
                // karena masalah CORS, jadi kita gunakan pesan sukses generik jika kita yakin request terkirim
                showStatus('Data telah dikirim. Terima kasih.', 'success');
                form.reset();
            })
            .finally(() => {
                // Kembalikan state tombol
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Kirim Absen';
                loader.style.display = 'none';
            });
        });

        // Fungsi untuk menampilkan pesan status
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (type === 'success') {
                statusDiv.classList.add('bg-green-100', 'text-green-800');
            } else {
                statusDiv.classList.add('bg-red-100', 'text-red-800');
            }
            
            statusDiv.classList.add('block');
            
            // Sembunyikan pesan otomatis setelah 5 detik
            setTimeout(hideStatus, 5000);
        }

        // Fungsi untuk menyembunyikan pesan status
        function hideStatus() {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.classList.add('hidden');
            statusDiv.classList.remove('block');
        }
    </script>
</body>
</html>
